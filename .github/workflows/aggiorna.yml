name: Aggiorna il pannello lavoro

on:
  schedule:
    # lunedi' e giovedi' alle 6:00 UTC (le 8:00 in Italia d'estate, le 7:00 d'inverno)
    - cron: "0 6 * * 1,4"
  workflow_dispatch:        # permette anche di lanciarlo a mano dal sito di GitHub
    inputs:
      manda_email:
        description: "Manda anche la mail di riepilogo (per provarla senza aspettare lunedi')"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ricostruisci config.json dalle credenziali riservate
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python prepara_config.py

      # Il browser serve solo ai siti che caricano gli annunci con JavaScript.
      # Se si rompe non blocca nulla: raccogli.py trova il file assente e va
      # avanti con le altre fonti.
      - name: Prepara il browser automatico
        continue-on-error: true
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visita i siti che richiedono un browser
        continue-on-error: true
        timeout-minutes: 12
        run: python raccogli_browser.py

      - name: Raccogli gli annunci
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python raccogli.py

      - name: Genera il sito
        run: python costruisci_sito.py

      - name: Salva lo storico (serve a capire cosa e' nuovo la volta dopo)
        run: |
          git config user.name "pannello-lavoro"
          git config user.email "actions@github.com"
          git add -f storico.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico $(date +%d/%m/%Y)"
          git push

      - name: Pubblica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - uses: actions/deploy-pages@v4

      # Se la mail non parte il pannello e' comunque aggiornato: un problema di
      # posta non deve far risultare fallito tutto l'aggiornamento.
      - name: Manda il riepilogo (il lunedi', o a richiesta)
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || inputs.manda_email }}
        env:
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          # Se esiste EMAIL_PASSWORD_2 si usa quella: e' la password per le app
          # generata dopo, mentre in EMAIL_PASSWORD era rimasta quella vecchia.
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD_2 || secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          INDIRIZZO_PANNELLO: ${{ secrets.INDIRIZZO_PANNELLO }}
        run: |
          if [ "${{ inputs.manda_email }}" = "true" ] || [ "$(date +%u)" = "1" ]; then
            python manda_email.py
          else
            echo "Non e' lunedi' e non e' stato chiesto l'invio: niente email."
          fi
